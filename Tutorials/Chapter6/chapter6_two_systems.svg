<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two different coordinate systems need two different kinds of distance math</title>
<desc>Real-world coordinates are latitude and longitude on a curved sphere, measured with the Haversine formula. Game-world coordinates are flat x, y, z units, measured with straight-line Euclidean distance.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="40" y="30" width="280" height="240" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="56" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">real-world coordinates</text>
<text x="60" y="76" font-family="sans-serif" font-size="12" fill="#085041">latitude, longitude</text>
<circle cx="180" cy="170" r="70" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text x="180" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">curved surface</text>
<text x="180" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Haversine formula</text>

<rect x="360" y="30" width="280" height="240" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="380" y="56" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">game-world coordinates</text>
<text x="380" y="76" font-family="sans-serif" font-size="12" fill="#712B13">x, y, (z) units</text>
<rect x="440" y="110" width="120" height="120" fill="none" stroke="#993C1D" stroke-width="1.5"/>
<line x1="440" y1="230" x2="560" y2="110" stroke="#993C1D" stroke-width="1.5"/>
<text x="500" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">flat plane</text>
<text x="500" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Euclidean formula</text>
</svg>
