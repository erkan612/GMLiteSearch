<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Grid search checks a range of cells, not just one</title>
<desc>The search radius may extend into neighboring cells, so grid search scans every cell that could possibly contain a point within range before measuring exact distances.</desc>
<rect width="680" height="320" fill="#ffffff"/>

<g stroke="#d3d1c7" stroke-width="0.5">
<line x1="180" y1="40" x2="180" y2="280"/>
<line x1="280" y1="40" x2="280" y2="280"/>
<line x1="380" y1="40" x2="380" y2="280"/>
<line x1="480" y1="40" x2="480" y2="280"/>
<line x1="80" y1="80" x2="580" y2="80"/>
<line x1="80" y1="160" x2="580" y2="160"/>
<line x1="80" y1="240" x2="580" y2="240"/>
</g>

<rect x="180" y="80" width="200" height="160" fill="none" stroke="#534AB7" stroke-width="2" stroke-dasharray="4 4"/>
<text x="280" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">cells scanned</text>

<circle cx="330" cy="180" r="55" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="330" cy="180" r="4" fill="#1D9E75"/>
<text x="330" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">search radius</text>

<rect x="60" y="290" width="560" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="303" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">the circle crosses into 3 neighboring cells — all get scanned before measuring exact distance</text>
</svg>
