<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How to update a document</title>
<desc>GMLiteSearch has no direct update function for plain document text. To change a document, remove it by id and add it again with the new content.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="220" fill="#ffffff"/>

<rect x="40" y="60" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Item price changes</text>
<text x="130" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">need to update the index</text>
<line x1="220" y1="88" x2="258" y2="88" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="60" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="350" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">gmls_remove_document</text>
<text x="350" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">old text leaves the index</text>
<line x1="440" y1="88" x2="478" y2="88" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="480" y="60" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="560" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">gmls_add_document</text>
<text x="560" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">new text goes back in</text>

<text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">There is no direct "update" function for plain document text.</text>
<text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The same id can be reused — the old entry is fully replaced.</text>
</svg>
