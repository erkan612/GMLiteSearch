<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Predicting a number versus predicting an order</title>
<desc>The linear model tries to guess each document's exact relevance number. RankNet instead learns directly which of two documents should rank higher, without needing an exact score to be correct.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="30" y="40" width="290" height="220" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="50" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">linear model's goal</text>
<text x="50" y="86" font-family="sans-serif" font-size="12" fill="#085041">"guess the exact number"</text>
<text x="175" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">true relevance: 0.90</text>
<text x="175" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">predicted: 0.62</text>
<text x="175" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">error = 0.28</text>
<text x="175" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">penalized even if the</text>
<text x="175" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">ORDER still came out right</text>

<rect x="360" y="40" width="290" height="220" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="380" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">RankNet's goal</text>
<text x="380" y="86" font-family="sans-serif" font-size="12" fill="#3C3489">"guess which one is better"</text>
<text x="505" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">doc A (relevance 0.9)</text>
<text x="505" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">doc B (relevance 0.3)</text>
<text x="505" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">does A score above B?</text>
<text x="505" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">only the ORDER matters —</text>
<text x="505" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">exact numbers are never required</text>
</svg>
