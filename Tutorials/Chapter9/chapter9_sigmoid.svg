<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The sigmoid function turns a score difference into a probability</title>
<desc>A large positive score difference maps close to a probability of 1, meaning the model is confident the higher document deserves to rank first. A score difference near zero maps close to 0.5, meaning the model has no real opinion yet.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<path d="M 60 250 Q 250 250 340 150 Q 430 50 620 50" fill="none" stroke="#0F6E56" stroke-width="2.5"/>

<circle cx="150" cy="240" r="5" fill="#0F6E56"/>
<text x="150" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">diff=-3</text>
<text x="150" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">P=0.047</text>

<circle cx="340" cy="150" r="5" fill="#0F6E56"/>
<text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">diff=0</text>
<text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">P=0.500</text>

<circle cx="530" cy="65" r="5" fill="#0F6E56"/>
<text x="530" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">diff=3</text>
<text x="530" y="45" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">P=0.953</text>

<line x1="60" y1="150" x2="620" y2="150" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="60" y="270" width="560" height="25" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">the training loop pushes P toward 1.0 for every "higher should outrank lower" pair</text>
</svg>
