<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How n-gram search breaks a word into trigrams</title>
<desc>A three-character sliding window moves across the word one letter at a time, producing a trigram at every position. Every document sharing even one trigram becomes a candidate match.</desc>
<rect width="680" height="260" fill="#ffffff"/>

<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">"dagger" — sliding window of 3</text>

<rect x="150" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="165" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">d</text>
<rect x="180" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="195" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">a</text>
<rect x="210" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="225" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">g</text>
<rect x="240" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="255" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">g</text>
<rect x="270" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="285" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">e</text>
<rect x="300" y="55" width="30" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="315" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">r</text>

<rect x="150" y="55" width="90" height="30" rx="4" fill="none" stroke="#EF9F27" stroke-width="2"/>
<text x="195" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">"dag"</text>

<rect x="180" y="55" width="90" height="30" rx="4" fill="none" stroke="#EF9F27" stroke-width="2" opacity="0.5"/>
<text x="225" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A" opacity="0.6">"agg"</text>

<rect x="90" y="150" width="500" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">trigrams: dag, agg, gge, ger</text>
<text x="340" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">the window moves one letter at a time, always exactly 3 characters wide</text>
<text x="340" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">any document sharing even ONE of these becomes a candidate, ranked by overlap count</text>
</svg>
