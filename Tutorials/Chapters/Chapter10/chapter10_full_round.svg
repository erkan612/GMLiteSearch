<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One complete LambdaMART training round</title>
<desc>Every round computes lambda gradients from the current scores, trains one tree to predict those gradients, then adds the tree's scaled output back into the running scores for the next round.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="260" fill="#ffffff"/>

<rect x="20" y="90" width="150" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="95" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">current scores</text>
<text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">from last round</text>
<line x1="170" y1="120" x2="208" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="90" width="150" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="285" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">compute lambdas</text>
<text x="285" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">NDCG-weighted pairs</text>
<line x1="360" y1="120" x2="398" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="400" y="90" width="150" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="475" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">train one tree</text>
<text x="475" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">predicts the lambdas</text>
<line x1="475" y1="150" x2="475" y2="180" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="182" width="190" height="50" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="475" y="207" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4A1B0C">scores += learning_rate × tree output</text>
<line x1="380" y1="207" x2="95" y2="207" stroke="#d3d1c7" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="95" y1="207" x2="95" y2="150" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">this loop repeats once per tree — 25 rounds in our example run</text>
</svg>
