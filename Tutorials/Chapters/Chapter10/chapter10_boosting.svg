<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Boosting builds many small trees that each correct the previous mistakes</title>
<desc>Each new tree is trained specifically on what the current ensemble still gets wrong, and its correction is added on top, gradually reducing overall error with each round.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="260" fill="#ffffff"/>

<rect x="20" y="90" width="90" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="65" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">starting</text>
<text x="65" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">guess</text>
<line x1="110" y1="120" x2="148" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="60" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="195" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">tree 1</text>
<text x="285" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#2c2c2a">+</text>
<line x1="240" y1="85" x2="310" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="310" y="90" width="90" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="355" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">tree 2</text>
<text x="445" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#2c2c2a">+</text>
<line x1="400" y1="115" x2="470" y2="150" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="470" y="130" width="90" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="515" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">tree 3 ...</text>

<line x1="560" y1="155" x2="598" y2="155" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600" y="130" width="60" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="630" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#173404">final</text>

<rect x="60" y="200" width="560" height="45" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="225" font-family="sans-serif" font-size="12" fill="#5F5E5A">each tree is DELIBERATELY simple and only sees where the ensemble is still wrong —</text>
<text x="80" y="243" font-family="sans-serif" font-size="12" fill="#5F5E5A">many small, weak corrections stacked together become a genuinely strong model</text>
</svg>
