<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A decision tree asks a series of yes or no questions</title>
<desc>Starting from a simple example unrelated to search: guessing an animal by asking whether it has fur, then whether it barks, narrowing down to an answer through a small number of simple questions.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="320" fill="#ffffff"/>

<rect x="270" y="20" width="140" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="43" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">has fur?</text>
<line x1="300" y1="66" x2="220" y2="106" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<line x1="380" y1="66" x2="460" y2="106" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="445" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no</text>

<rect x="140" y="108" width="150" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="215" y="131" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">barks?</text>
<rect x="390" y="108" width="150" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="465" y="131" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#26215C">has feathers?</text>

<line x1="180" y1="154" x2="120" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="130" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<line x1="260" y1="154" x2="290" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no</text>

<rect x="50" y="202" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="115" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">dog</text>
<rect x="230" y="202" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="295" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">cat</text>

<line x1="430" y1="154" x2="400" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<line x1="500" y1="154" x2="540" y2="200" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no</text>

<rect x="330" y="202" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="395" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">parrot</text>
<rect x="480" y="202" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="545" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">lizard</text>

<rect x="60" y="270" width="560" height="35" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">every leaf at the bottom is a final answer — a few questions narrow a lot of possibilities</text>
</svg>
