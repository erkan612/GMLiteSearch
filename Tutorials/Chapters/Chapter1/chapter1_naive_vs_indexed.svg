<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Naive search compared to indexed search</title>
<desc>Two flows side by side: naive search checks every document one by one when a query arrives, while indexed search looks up the query directly in a prebuilt table.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="420" fill="#ffffff"/>

<text x="170" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">Without an index</text>
<text x="510" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">With an index</text>

<rect x="90" y="50" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="170" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Query: "fire"</text>
<line x1="170" y1="94" x2="170" y2="128" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="128" width="180" height="220" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="170" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Check every item</text>
<text x="170" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Item 1: no match</text>
<text x="170" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Item 2: no match</text>
<text x="170" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Item 3: no match</text>
<text x="170" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">...</text>
<text x="170" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Item 18: match!</text>
<text x="170" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">...</text>
<text x="170" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Item 55: no match</text>
<text x="170" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">55 checks, every time</text>

<rect x="430" y="50" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="510" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Query: "fire"</text>
<line x1="510" y1="94" x2="510" y2="128" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="420" y="128" width="180" height="90" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Look up "fire"</text>
<text x="510" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">in the prebuilt table</text>
<text x="510" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">1 lookup, every time</text>

<line x1="510" y1="218" x2="510" y2="252" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="420" y="252" width="180" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Table already says:</text>
<text x="510" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">items 18, 23, 35, 41...</text>

<line x1="260" y1="238" x2="410" y2="238" stroke="#d3d1c7" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="335" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The index is built once, when documents are added.</text>
<text x="335" y="393" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Every search after that is a fast lookup, not a scan.</text>
</svg>
