<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a geohash is built by repeatedly halving a coordinate box</title>
<desc>Each bit of a geohash asks whether the point falls in the left or right half of the current longitude or latitude range, alternating between the two, and narrows the box a little more each time.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="340" fill="#ffffff"/>

<text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">encoding NYC (40.71, -74.01) — each step halves the box</text>

<rect x="40" y="45" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="63" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">lng: -180 to 180</text>
<text x="130" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">-74 is in the right half</text>
<line x1="220" y1="70" x2="248" y2="70" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="45" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="63" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">bit 1 = 1</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">box narrows to 0 to 180</text>

<rect x="40" y="110" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">lat: -90 to 90</text>
<text x="130" y="145" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">40.71 is in the right half</text>
<line x1="220" y1="135" x2="248" y2="135" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="110" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">bit 2 = 1</text>
<text x="340" y="145" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">box narrows to 0 to 90</text>

<text x="340" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">...alternating longitude and latitude, five bits at a time...</text>

<rect x="150" y="205" width="380" height="55" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">every 5 bits becomes one base32 character</text>
<text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">6 characters ("dr5reg") narrows the box to about 600 meters wide</text>

<rect x="60" y="275" width="560" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="297" font-family="sans-serif" font-size="12" fill="#5F5E5A">more characters = smaller box = more precise location</text>
<text x="80" y="313" font-family="sans-serif" font-size="12" fill="#5F5E5A">precision 5 ≈ several km wide, precision 8 ≈ a few meters wide</text>
</svg>
