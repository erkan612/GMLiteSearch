<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A custom feature extractor extends the built-in feature vector</title>
<desc>The seven built-in features are computed automatically. A registered custom extractor runs afterward and adds its own value to the same vector, using data GMLiteSearch has no built-in way to know about.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="260" fill="#ffffff"/>

<rect x="30" y="40" width="380" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="50" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">7 built-in features</text>
<text x="50" y="86" font-family="sans-serif" font-size="12" fill="#085041">bm25_score, title_match, freshness, ...</text>
<text x="440" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="500" fill="#2c2c2a">+</text>

<rect x="470" y="40" width="180" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">player_rating</text>
<text x="490" y="86" font-family="sans-serif" font-size="12" fill="#3C3489">your own data source</text>

<line x1="340" y1="130" x2="340" y2="160" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="30" y="160" width="620" height="80" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="50" y="184" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">gmls_register_feature_extractor("player_rating", fn)</text>
<text x="50" y="206" font-family="sans-serif" font-size="12" fill="#5F5E5A">the model learns a weight for player_rating just like any built-in</text>
<text x="50" y="224" font-family="sans-serif" font-size="12" fill="#5F5E5A">feature — GMLiteSearch never needs to know what the number means</text>
</svg>
