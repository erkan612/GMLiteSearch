<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How training examples become comparison pairs</title>
<desc>Examples are grouped by query, then every two examples in the same group with different relevance become one training pair. Examples from different queries are never paired together.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="30" y="40" width="280" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="50" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">query: "fantasy rpg"</text>
<text x="50" y="86" font-family="sans-serif" font-size="12" fill="#085041">8 examples, 3 relevance tiers</text>
<text x="50" y="116" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">→ 19 pairs (ties excluded)</text>

<rect x="370" y="40" width="280" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="390" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">query: "cozy relaxing"</text>
<text x="390" y="86" font-family="sans-serif" font-size="12" fill="#3C3489">5 examples, 3 relevance tiers</text>
<text x="390" y="116" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">→ 8 pairs</text>

<rect x="200" y="160" width="280" height="100" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="220" y="184" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">query: "strategy diplomacy"</text>
<text x="220" y="206" font-family="sans-serif" font-size="12" fill="#712B13">3 examples, 3 relevance tiers</text>
<text x="220" y="236" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">→ 3 pairs</text>

<rect x="60" y="275" width="560" height="25" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">30 total pairs — never one from "fantasy rpg" paired against "cozy relaxing"</text>
</svg>
