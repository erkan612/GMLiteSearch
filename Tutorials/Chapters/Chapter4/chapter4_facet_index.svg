<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How faceted documents get indexed</title>
<desc>Each facet name maps to a table of values, and each value maps to a list of document IDs that have that value. Array-valued facets like tags add the document to multiple value lists at once.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="320" fill="#ffffff"/>

<rect x="40" y="30" width="600" height="270" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="56" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">facet_index</text>

<rect x="70" y="80" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">category</text>
<line x1="180" y1="98" x2="218" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="80" width="120" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="280" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">"rpg"</text>
<line x1="340" y1="98" x2="378" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="380" y="80" width="220" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="490" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">gm_001, gm_002, gm_004...</text>

<rect x="70" y="135" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="153" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">tags</text>
<line x1="180" y1="153" x2="218" y2="153" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="135" width="120" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="280" y="153" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">"fantasy"</text>
<line x1="340" y1="153" x2="378" y2="153" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="380" y="135" width="220" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="490" y="153" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">gm_001, gm_002, gm_007...</text>

<rect x="70" y="200" width="530" height="80" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="90" y="222" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">array-valued facets add to MULTIPLE lists</text>
<text x="90" y="244" font-family="sans-serif" font-size="12" fill="#633806">gm_001 has tags: ["fantasy", "open-world", "story-rich"]</text>
<text x="90" y="262" font-family="sans-serif" font-size="12" fill="#633806">so it appears in the "fantasy" list, the "open-world" list, AND the "story-rich" list</text>
</svg>
