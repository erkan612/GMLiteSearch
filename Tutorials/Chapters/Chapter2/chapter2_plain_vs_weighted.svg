<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Plain versus weighted document text</title>
<desc>gmls_add_document_weighted repeats the title three times and each tag twice directly in the indexed text, which increases how often those words are counted during scoring.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>

<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">gmls_add_document (plain)</text>
<rect x="60" y="50" width="560" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="76" font-family="sans-serif" font-size="12" fill="#5F5E5A">"Guard Captain Roderick Vane. Commands the</text>
<text x="80" y="94" font-family="sans-serif" font-size="12" fill="#5F5E5A">town watch and takes the safety of Millhaven's</text>
<text x="80" y="112" font-family="sans-serif" font-size="12" fill="#5F5E5A">citizens very seriously."</text>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">"guard" appears 1 time</text>

<line x1="340" y1="160" x2="340" y2="190" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">gmls_add_document_weighted</text>
<rect x="60" y="238" width="560" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="80" y="262" font-family="sans-serif" font-size="12" fill="#085041">"Commands the town watch and takes the safety</text>
<text x="80" y="280" font-family="sans-serif" font-size="12" fill="#085041">of Millhaven's citizens very seriously.</text>
<text x="80" y="300" font-family="sans-serif" font-size="12" fill="#085041">Guard Captain Roderick Vane Guard Captain</text>
<text x="80" y="318" font-family="sans-serif" font-size="12" fill="#085041">Roderick Vane Guard Captain Roderick Vane"</text>
<text x="80" y="342" font-family="sans-serif" font-size="12" fill="#085041">title repeated 3 times, tags repeated 2 times each</text>

<text x="340" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">"guard" now appears 4 times (1 original + 3 from title repeat)</text>
</svg>
