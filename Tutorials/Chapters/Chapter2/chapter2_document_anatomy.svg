<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anatomy of a stored document</title>
<desc>A document struct contains an id, the indexed text, a word count computed automatically, and a metadata struct with title, tags, and timestamp.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="380" fill="#ffffff"/>

<rect x="40" y="40" width="600" height="300" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Stored document</text>
<text x="60" y="84" font-family="sans-serif" font-size="12" fill="#5F5E5A">what gmls_get_document returns</text>

<rect x="70" y="105" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="127" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">id</text>
<text x="240" y="122" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">"npc_005"</text>
<text x="240" y="140" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">the id you chose</text>

<rect x="70" y="160" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="182" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">text</text>
<text x="240" y="176" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">what was actually indexed</text>
<text x="240" y="194" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">(includes repeats, if weighted)</text>

<rect x="70" y="215" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="237" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">word_count</text>
<text x="240" y="238" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">set automatically by GMLiteSearch</text>

<rect x="70" y="270" width="530" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="90" y="290" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">metadata</text>
<text x="90" y="308" font-family="sans-serif" font-size="12" fill="#3C3489">title: "Guard Captain Roderick Vane"   tags: [...]   timestamp: ...</text>
<text x="90" y="322" font-family="sans-serif" font-size="12" fill="#3C3489">any extra fields you attach yourself</text>
</svg>
