<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How gmls_spell_check decides whether to correct a word</title>
<desc>The word is checked against the logged-query dictionary and the live index first. Only if no exact match exists does it search for the closest word by edit distance, accepting a correction only within a distance of two.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="380" fill="#ffffff"/>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">input word</text>
<line x1="340" y1="64" x2="340" y2="94" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="94" width="280" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="112" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">exact match in query dictionary</text>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">or the live word index?</text>
<line x1="200" y1="119" x2="140" y2="119" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="170" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<rect x="20" y="94" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="80" y="119" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">return as-is</text>

<line x1="340" y1="144" x2="340" y2="174" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no</text>

<rect x="180" y="174" width="320" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#26215C">find the CLOSEST word by edit distance</text>
<text x="340" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">(number of single-letter changes needed)</text>
<line x1="340" y1="234" x2="340" y2="264" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="264" width="320" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="289" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#412402">is that distance 1 or 2?</text>
<line x1="180" y1="289" x2="120" y2="289" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="279" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<rect x="20" y="264" width="100" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="70" y="289" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">return correction</text>
<line x1="500" y1="289" x2="560" y2="289" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="279" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no (0 or 3+)</text>
<rect x="560" y="264" width="100" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="610" y="289" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">return original</text>

<text x="340" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">the dictionary is built from LOGGED QUERIES, not from indexed documents</text>
</svg>
