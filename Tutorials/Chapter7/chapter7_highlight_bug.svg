<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A known bug: mixed-case highlighting can silently skip terms</title>
<desc>When one search term matches the document text exactly and another only matches with different capitalization, the case-insensitive fallback never runs, so the differently-capitalized term is silently left unhighlighted.</desc>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="40" y="30" width="600" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="55" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">text: "the dragon is also called a Wyrm in old texts"</text>
<text x="340" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">terms: "dragon", "wyrm"</text>

<rect x="40" y="120" width="280" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">"dragon" — exact match</text>
<text x="180" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">highlighted correctly</text>

<rect x="360" y="120" width="280" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">"Wyrm" — different case</text>
<text x="500" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">silently NOT highlighted</text>

<rect x="60" y="200" width="560" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="80" y="222" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">why: the fallback only runs if NOTHING matched</text>
<text x="80" y="244" font-family="sans-serif" font-size="12" fill="#633806">since "dragon" already matched, the whole snippet is considered "done" —</text>
<text x="80" y="262" font-family="sans-serif" font-size="12" fill="#633806">the case-insensitive check for "Wyrm" never gets a chance to run</text>
</svg>
