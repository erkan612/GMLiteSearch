<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Two levels of filter logic: within a facet versus across facets</title>
<desc>Selecting multiple values within one facet always works as OR. The AND or OR operator you set only controls how different facets combine with each other.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>

<rect x="40" y="30" width="600" height="130" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="56" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">level 1 — inside one facet: ALWAYS a union (OR)</text>
<rect x="70" y="76" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="160" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">category = "rpg"</text>
<text x="270" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">OR</text>
<rect x="290" y="76" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="390" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">category = "strategy"</text>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">this combination is fixed — it cannot be switched to AND</text>

<rect x="40" y="185" width="600" height="150" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="211" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">level 2 — across DIFFERENT facets: your filter_operator setting decides</text>
<rect x="70" y="231" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="150" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">category = "rpg"</text>
<text x="270" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">AND / OR</text>
<rect x="330" y="231" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="410" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">platform = "pc"</text>
<text x="340" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">gmls_set_filter_operator("AND") — must satisfy both facets</text>
<text x="340" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">gmls_set_filter_operator("OR") — satisfying either facet is enough</text>

<text x="340" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">picking two categories always widens results (more games qualify)</text>
<text x="340" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">picking category + platform under AND always narrows results</text>
</svg>
