<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The seven built-in features describing one document for one query</title>
<desc>Each feature is a single number summarizing one aspect of how well a document matches a query. Together they form the feature vector that the model actually learns from.</desc>
<rect width="680" height="260" fill="#ffffff"/>

<text x="340" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">one document, scored on 7 numeric features</text>

<rect x="30" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="75" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">bm25_score</text>
<text x="75" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.42</text>

<rect x="130" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">term_freq</text>
<text x="175" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.18</text>

<rect x="230" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">doc_length</text>
<text x="275" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.30</text>

<rect x="330" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="375" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">title_match</text>
<text x="375" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">1.00</text>

<rect x="430" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="475" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">coverage</text>
<text x="475" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.75</text>

<rect x="530" y="50" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="575" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">freshness</text>
<text x="575" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.60</text>

<rect x="230" y="115" width="90" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="275" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">popularity</text>
<text x="275" y="151" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">0.20</text>

<rect x="60" y="190" width="560" height="55" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="212" font-family="sans-serif" font-size="12" fill="#5F5E5A">the model never sees the document's TEXT — only these 7 numbers</text>
<text x="80" y="230" font-family="sans-serif" font-size="12" fill="#5F5E5A">training means finding a weight for each number that predicts relevance well</text>
</svg>
