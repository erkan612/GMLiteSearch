<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gradient descent as walking downhill toward lower error</title>
<desc>Loss is highest when the weights are far from correct. Each training step nudges the weights a small distance in the direction that reduces loss the fastest, like walking downhill toward the bottom of a valley.</desc>
<rect width="680" height="320" fill="#ffffff"/>

<path d="M 60 260 Q 220 60 340 240 Q 460 380 620 100" fill="none" stroke="#0F6E56" stroke-width="2.5"/>

<circle cx="120" cy="185" r="7" fill="#D85A30"/>
<text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">start (random weights)</text>

<circle cx="340" cy="240" r="7" fill="#1D9E75"/>
<text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">lowest loss</text>
<text x="340" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">the weights that fit best</text>

<circle cx="230" cy="130" r="5" fill="#5F5E5A" opacity="0.6"/>
<circle cx="280" cy="185" r="5" fill="#5F5E5A" opacity="0.6"/>
<circle cx="315" cy="220" r="5" fill="#5F5E5A" opacity="0.6"/>

<text x="70" y="30" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">loss (error)</text>
<text x="640" y="305" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">weight value</text>

<rect x="60" y="40" width="560" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="62" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">each dot is one training iteration — the weight moves a small step</text>
<text x="80" y="78" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">in whichever direction makes the loss go down, learning_rate at a time</text>
</svg>
