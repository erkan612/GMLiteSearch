<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The basic idea of training a model</title>
<desc>A model makes a guess using its current weights, compares that guess to the true answer, and nudges the weights slightly to make the next guess a little closer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="30" y="40" width="160" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">current weights</text>
<text x="110" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">(a rough guess to start)</text>
<line x1="190" y1="70" x2="228" y2="70" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="40" width="160" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="310" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">model's prediction</text>
<text x="310" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">"I think this is a 0.6"</text>
<line x1="390" y1="70" x2="428" y2="70" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="430" y="40" width="220" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="540" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">compare to the true answer</text>
<text x="540" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">"it was actually a 1.0"</text>

<line x1="540" y1="100" x2="540" y2="130" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="130" width="270" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="515" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">nudge the weights</text>
<text x="515" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">a little toward the true answer</text>
<line x1="380" y1="160" x2="110" y2="160" stroke="#d3d1c7" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="110" y1="160" x2="110" y2="100" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="230" width="560" height="55" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="252" font-family="sans-serif" font-size="12" fill="#5F5E5A">this whole loop repeats — once per training example, many times over —</text>
<text x="80" y="270" font-family="sans-serif" font-size="12" fill="#5F5E5A">each pass nudging the weights a little closer to matching reality</text>
</svg>
