<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How fuzzy search measures similarity using bigrams</title>
<desc>Each word is broken into overlapping two-letter chunks called bigrams. Similarity is the fraction of bigrams the two words share.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>

<text x="170" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">"fantasy"</text>
<rect x="40" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="55" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">fa</text>
<rect x="74" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="89" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">an</text>
<rect x="108" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="123" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">nt</text>
<rect x="142" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="157" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">ta</text>
<rect x="176" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="191" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">as</text>
<rect x="210" y="45" width="30" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="225" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">sy</text>

<text x="510" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">"fantacy"</text>
<rect x="410" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="425" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">fa</text>
<rect x="444" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="459" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">an</text>
<rect x="478" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="493" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">nt</text>
<rect x="512" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="527" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">ta</text>
<rect x="546" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="561" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">ac</text>
<rect x="580" y="45" width="30" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="595" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#26215C">cy</text>

<rect x="90" y="110" width="500" height="90" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">shared bigrams: fa, an, nt, ta</text>
<text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">4 shared out of 8 total unique bigrams (fa,an,nt,ta,as,sy,ac,cy)</text>
<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">similarity = 4 / 8 = 0.500</text>
<text x="340" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">below the default 0.6 threshold — this pair would NOT match</text>

<text x="340" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">similarity = shared bigrams / total unique bigrams (Jaccard overlap)</text>
<text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">a lower score means fewer letter-pairs in common between the two words</text>
</svg>
