<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How gmls_search_hybrid decides what to return</title>
<desc>Hybrid search runs an exact search first. If there are exact matches and the query is longer than three characters, it returns those results directly. Otherwise it merges in prefix search results.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>

<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">run exact search</text>
<line x1="340" y1="64" x2="340" y2="98" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="98" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">exact matches found AND</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">query is longer than 3 characters?</text>

<line x1="220" y1="126" x2="130" y2="126" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="175" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">yes</text>
<rect x="30" y="98" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">return exact results</text>
<text x="120" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">prefix search skipped</text>

<line x1="480" y1="126" x2="560" y2="126" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">no</text>
<rect x="490" y="98" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="580" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">run prefix search too</text>
<text x="580" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">merge with exact</text>

<line x1="580" y1="154" x2="580" y2="188" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="188" width="200" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="580" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">shared results get</text>
<text x="580" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">exact score + (prefix score × 0.5)</text>
<text x="580" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">prefix-only results added as-is</text>

<rect x="60" y="290" width="560" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="312" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">the 3-character rule</text>
<text x="80" y="332" font-family="sans-serif" font-size="12" fill="#5F5E5A">a query of 3 characters or fewer ALWAYS takes the merge path,</text>
<text x="80" y="350" font-family="sans-serif" font-size="12" fill="#5F5E5A">even if it already has exact matches — short queries benefit most</text>
<text x="80" y="368" font-family="sans-serif" font-size="12" fill="#5F5E5A">from the extra coverage prefix search provides</text>
</svg>
