<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Date ranges include the start moment but exclude the end moment</title>
<desc>A date filter range matches any date greater than or equal to the start, and strictly less than the end. A release exactly at the end boundary does not match.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="220" fill="#ffffff"/>

<line x1="80" y1="90" x2="600" y2="90" stroke="#2c2c2a" stroke-width="1.5"/>
<circle cx="80" cy="90" r="6" fill="#1D9E75"/>
<circle cx="600" cy="90" r="6" fill="none" stroke="#D85A30" stroke-width="2"/>

<text x="80" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">start</text>
<text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">end</text>
<text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">included</text>
<text x="600" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">excluded</text>

<rect x="150" y="60" width="90" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="195" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">matches</text>
<rect x="350" y="60" width="90" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="395" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">matches</text>
<rect x="555" y="60" width="90" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="600" y="94" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">does NOT match</text>

<rect x="60" y="150" width="560" height="55" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="172" font-family="sans-serif" font-size="12" fill="#5F5E5A">a release dated exactly at the end boundary is excluded —</text>
<text x="80" y="190" font-family="sans-serif" font-size="12" fill="#5F5E5A">the comparison is start &lt;= date &lt; end, not &lt;= end</text>
</svg>
