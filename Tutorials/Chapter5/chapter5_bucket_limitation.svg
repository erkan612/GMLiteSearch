<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why the automatic range-facet bucket scheme is not useful for dates</title>
<desc>GameMaker stores dates as a serial number of days since 1899. The fixed 0 to 9, 10 to 19, 20 to 49, 50 to 99, 100 plus bucket scheme was designed for small numbers like prices, so every real-world date lands in the same 100 plus bucket.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="320" fill="#ffffff"/>

<text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">a date is really just a big number under the hood</text>
<rect x="60" y="45" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">July 30, 2026 is stored as roughly 46,233</text>
<text x="340" y="83" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">(days elapsed since December 30, 1899)</text>

<line x1="340" y1="105" x2="340" y2="135" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">gmls_add_date_facet reuses the price-style bucket scheme</text>
<rect x="60" y="175" width="100" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="110" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">0-9</text>
<rect x="165" y="175" width="100" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="215" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">10-19</text>
<rect x="270" y="175" width="100" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="320" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">20-49</text>
<rect x="375" y="175" width="100" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="425" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">50-99</text>
<rect x="480" y="175" width="140" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/><text x="550" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#4A1B0C">100+ ← every date lands here</text>

<rect x="60" y="230" width="560" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="80" y="252" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">the automatic bucketing is not useful for filtering by date</text>
<text x="80" y="272" font-family="sans-serif" font-size="12" fill="#633806">use gmls_add_date_filter and gmls_get_date_histogram instead —</text>
<text x="80" y="290" font-family="sans-serif" font-size="12" fill="#633806">both compare real date values directly, not this collapsed bucket</text>
</svg>
